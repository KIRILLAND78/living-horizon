name: release

# Merging is what cuts a release: main produces a stable one, develop a pre-release.
# Tags are created here rather than being the trigger. Doc-only changes are excluded:
# develop builds unconditionally otherwise, and a jar carries no doc content worth a
# pre-release.
on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to release, e.g. 0.1.0 or 1.0.0. Leave empty to derive it from the commits.'
        required: false
        type: string

permissions:
  contents: write
  # Reads the pull request build's jars, which are artifacts of another run.
  actions: read

# Two merges in a row must not compute the same number at once. Nothing is cancelled,
# because a release may be halfway through tagging and pushing.
concurrency:
  group: release
  cancel-in-progress: false

# The version is worked out once, each target builds on its own runner (or takes the
# jar its pull request already built), and nothing is tagged before every jar exists.
# Then the GitHub release, and from it, side by side and each on its own, Modrinth,
# CurseForge, Nexus Mods (publish.yml) and the Discord announcement: one platform
# failing is re-run alone, without publishing the others or announcing twice.
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      targets: ${{ steps.targets.outputs.targets }}
      prebuilt: ${{ steps.prebuilt.outputs.run }}

    steps:
      - name: Checkout
        # Full history and tags: the version is derived from the commits since the
        # last tag.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "${{ github.ref_name }}" = 'develop' ]; then
            # The same script as the pull request build, so a merge gets the number
            # its pull request stamped on its jars.
            version=$(.github/scripts/release-version.sh develop)
            channel=dev
          elif [ -n "$MANUAL_VERSION" ]; then
            # The manual path exists for the versions no commit message should
            # decide on its own: the first release, and 1.0.0.
            version="$MANUAL_VERSION"
            channel=stable
          else
            version=$(.github/scripts/release-version.sh main)
            channel=stable
          fi

          if [ -z "$version" ]; then
            echo 'No commit since the last tag earns a release. Nothing to do.'
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} already exists. Nothing to do."
            echo 'release=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Releasing v${version} (${channel})"
          {
            echo 'release=true'
            echo "version=${version}"
            echo "channel=${channel}"
          } >> "$GITHUB_OUTPUT"

      - name: List the targets
        # Read from stonecutter.properties.toml, one entry per table, so a target
        # added there is built and published without this file changing.
        id: targets
        run: echo "targets=$(python3 .github/scripts/release-targets.py)" >> "$GITHUB_OUTPUT"

      - name: Look for the pull request's build
        # The build workflow leaves a marker once every target of a pull request into
        # develop or main is built, named after the merged files and the version it
        # stamped. Its jars are taken when both match this commit's, and the run built
        # the pull request this commit merged: its head is one of the parents, so the
        # workflow that made them is the reviewed one now on this branch. Anything
        # else (a newer base, an expired artifact, a squash merge) builds again.
        if: steps.version.outputs.release == 'true'
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          parents=$(git rev-parse 'HEAD^@')
          run=''
          # Newest first.
          while read -r id head; do
            if grep -qxF "$head" <<<"$parents"; then run=$id; break; fi
          done < <(gh api "repos/${{ github.repository }}/actions/artifacts?name=prebuilt-${tree}-${VERSION}&per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | "\(.workflow_run.id) \(.workflow_run.head_sha)"')
          if [ -n "$run" ]; then
            echo "Taking the jars of build run ${run}."
          else
            echo 'No pull request build of these files at this version: building.'
          fi
          echo "run=${run}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      # One target failing must not cancel the others: "Re-run failed jobs" then retries
      # only that one, and the release waits for all of them anyway.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.version.outputs.targets) }}
    name: build ${{ matrix.target.node }}
    runs-on: ubuntu-latest
    # A healthy build takes minutes; gradle.sh gives each of its three attempts 25. Without
    # a ceiling, a hung download held the job, and every release queued behind it, 6 hours.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Take the pull request's jar
        # A target the pull request did not build, or a download that fails, is built
        # below instead.
        if: needs.version.outputs.prebuilt != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: livinghorizon-${{ matrix.target.node }}
          path: build/libs/${{ needs.version.outputs.version }}
          run-id: ${{ needs.version.outputs.prebuilt }}
          github-token: ${{ github.token }}

      - name: Check the pull request's jar
        # One jar carrying this version, or nothing is taken.
        id: reuse
        if: needs.version.outputs.prebuilt != ''
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(build/libs/"$VERSION"/livinghorizon-"$VERSION"+*.jar)
          if [ "${#jars[@]}" -eq 1 ]; then
            ls -l build/libs/"$VERSION"
            echo 'taken=true' >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No jar at ${VERSION} from the pull request's build; building it."
            rm -rf build/libs
          fi

      - name: Set up JDKs
        if: steps.reuse.outputs.taken != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Minecraft up to 1.20.4 runs on Java 17, then Java 21, and 26.x on Java 25.
          # The last entry becomes JAVA_HOME and so runs Gradle itself, which needs 21:
          # Loom and the build plugins do not run on 17.
          java-version: |
            25
            17
            21

      - name: Restore the Gradle cache
        # Read only, as on a pull request: develop reads what the cache workflow saved
        # there, main finds nothing of it and builds without.
        if: steps.reuse.outputs.taken != 'true'
        uses: ./.github/actions/gradle-cache
        with:
          node: ${{ matrix.target.node }}

      - name: Set up Gradle
        if: steps.reuse.outputs.taken != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          # Writing here would evict what the cache workflow keeps for the pull requests.
          cache-disabled: true

      - name: Stamp the version
        if: steps.reuse.outputs.taken != 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # stonecutter.properties.toml is the single source of the mod version, and
          # it wins over -P properties on the command line.
          sed -i "s/^mod\.version = .*/mod.version = \"${VERSION}\"/" stonecutter.properties.toml
          grep '^mod.version' stonecutter.properties.toml

      - name: Build
        if: steps.reuse.outputs.taken != 'true'
        # The tests already ran on the pull request; this only builds the jar. A
        # download that fails or hangs is tried again (gradle.sh); any other failure is not.
        env:
          NODE: ${{ matrix.target.node }}
        run: .github/scripts/gradle.sh ":${NODE}:buildAndCollect"

      - name: Hand the files to the release
        uses: actions/upload-artifact@v4
        with:
          name: files-${{ matrix.target.node }}
          path: build/libs/*/*
          if-no-files-found: error
          # The release attaches them; the artifact itself is only the hand-over.
          retention-days: 1

  release:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect the files
        uses: actions/download-artifact@v4
        with:
          pattern: files-*
          path: files
          merge-multiple: true

      - name: Set up Node
        # runs the changelog script that dates the release
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record the version on main
        # Only stable releases write the number back, so the file on main always
        # states the version that was actually released. A push made with
        # GITHUB_TOKEN does not start another workflow run, so this cannot loop.
        if: needs.version.outputs.channel == 'stable'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^mod\.version = .*/mod.version = \"${VERSION}\"/" stonecutter.properties.toml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stonecutter.properties.toml
          # The changelog is dated in the same commit, so the tag carries it: the
          # "Unreleased" section becomes this version.
          node .github/scripts/changelog-release.js "${VERSION}"
          git add changelog
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:"${{ github.ref_name }}"
          git push origin "v${VERSION}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANNEL: ${{ needs.version.outputs.channel }}
        run: |
          set -euo pipefail

          # A release from main is a full release, GitHub's "Latest" one, never a
          # pre-release. Below 1.0.0 the mod is in beta: the title says so.
          args=(--generate-notes --title "v${VERSION}" --latest)
          if [ "$CHANNEL" = 'stable' ] && [[ $VERSION == 0.* ]]; then
            args=(--generate-notes --title "v${VERSION} (beta)" --latest)
          fi

          if [ "$CHANNEL" = 'dev' ]; then
            # Marked as a pre-release so it never displays as the latest version.
            args=(--generate-notes --title "v${VERSION}" --prerelease --latest=false --target "${{ github.sha }}")

            # Generate the notes from the last stable release, so a dev build lists
            # what it adds over the last thing that shipped rather than over the
            # previous dev build. Skipped while no stable release exists: passing an
            # empty --notes-start-tag fails the command.
            # || true because grep exits 1 when there is no tag at all, and under
            # pipefail that would kill the step before gh is ever reached.
            last_stable=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-dev\.' | head -n 1 || true)
            if [ -n "$last_stable" ]; then
              args+=(--notes-start-tag "$last_stable")
            fi
          fi

          # Wherever the artifacts unpacked them: the jar of every target.
          mapfile -t files < <(find files -name '*.jar' | sort)
          echo "${#files[@]} files"
          gh release create "v${VERSION}" "${args[@]}" "${files[@]}"

  # Stable releases only: the -dev builds are untested previews and stay on GitHub.
  # One job per platform, so a failure on one is re-run alone. Each takes the jars from
  # the GitHub release and is skipped, not failed, while the platform's token or id is
  # missing: MODRINTH_TOKEN, CURSEFORGE_TOKEN, NEXUSMODS_TOKEN (secrets) and
  # MODRINTH_ID, CURSEFORGE_ID, NEXUSMODS_ID (variables; the last is the number in the
  # Nexus page's URL).
  modrinth:
    needs: [version, release]
    if: needs.version.outputs.channel == 'stable'
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: modrinth
    secrets: inherit

  curseforge:
    needs: [version, release]
    if: needs.version.outputs.channel == 'stable'
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: curseforge
    secrets: inherit

  nexus:
    needs: [version, release]
    if: needs.version.outputs.channel == 'stable'
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      platform: nexus
    secrets: inherit

  # Never blocking: nothing depends on this job, so a Discord hiccup cannot undo a
  # release that is already on GitHub. It waits for the release only, never for the
  # platforms, so re-running one of them never announces the release again. It reads the
  # changelog from the release tag - where the release job dated it - and posts that
  # version in each language that has a webhook secret (DISCORD_WEBHOOK_EN / _FR, or
  # DISCORD_WEBHOOK alone for English), pinging the role whose ID is in the
  # DISCORD_ROLE_EN / _FR or DISCORD_ROLE variable (@Updates when unset). Stable releases only: the -dev builds are
  # never announced.
  announce:
    needs: [version, release]
    if: needs.version.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Announce on Discord
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_EN: ${{ secrets.DISCORD_WEBHOOK_EN }}
          DISCORD_WEBHOOK_FR: ${{ secrets.DISCORD_WEBHOOK_FR }}
          DISCORD_ROLE: ${{ vars.DISCORD_ROLE || '1561725342664626237' }}
          DISCORD_ROLE_EN: ${{ vars.DISCORD_ROLE_EN }}
          DISCORD_ROLE_FR: ${{ vars.DISCORD_ROLE_FR }}
        run: node .github/scripts/announce-discord.js --version "$VERSION"
